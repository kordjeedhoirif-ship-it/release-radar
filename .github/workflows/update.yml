# Robot Release Radar : met à jour data/releases.json toutes les 6 heures (gratuit sur GitHub)
name: Mise à jour des sorties

on:
  schedule:
    - cron: '17 */6 * * *'   # 4 fois par jour (heure UTC)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-releases
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les sorties
        run: node scripts/update.mjs
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "release-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour des sorties $(date -u +'%Y-%m-%d %H:%M')"
          # si le dépôt a changé pendant le passage, on se remet à jour avant d'envoyer
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
